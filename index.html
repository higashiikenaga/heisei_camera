<style>
:root{--rec:#ff3b30;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{margin:0;height:100%;overflow:hidden;color:#fff;
  font-family:"Hiragino Sans","Noto Sans JP","Meiryo",system-ui,sans-serif;}
body{display:flex;align-items:center;justify-content:center;
  background:#0c0c0e repeating-linear-gradient(45deg,#0000 0 6px,#ffffff06 6px 7px);}
button{font-family:inherit;}

/* ================= スキン定義 ================= */
body[data-skin=g1]{--body:linear-gradient(#2c2d33,#131419);--fg:#ddd;--key:linear-gradient(#4a4c55,#2b2c33);--keyfg:#e8e8ea;--keysh:#000;--accent:#5ac8ff;--bezel:#07070a;--bezelring:#8d9099;--lcd:repeating-linear-gradient(0deg,#0000 0 2px,#0000001a 2px 3px),repeating-linear-gradient(90deg,#0000 0 2px,#0000001a 2px 3px);--osd:#9fe8ff;--r:18px;}
body[data-skin=g2]{--body:linear-gradient(135deg,#f1f3f6,#aab0b9 55%,#d8dbe0);--fg:#222;--key:linear-gradient(#fbfbfc,#c4c8cf);--keyfg:#2b2f36;--keysh:#7d828b;--accent:#2a6cff;--bezel:#1a2a38;--bezelring:#666d77;--lcd:repeating-linear-gradient(0deg,#0000 0 2px,#0a2a4a22 2px 3px),repeating-linear-gradient(90deg,#0000 0 2px,#0a2a4a22 2px 3px);--osd:#fff;--r:14px;}
body[data-skin=g3]{--body:linear-gradient(160deg,#ffd0e3,#ff8fbd 60%,#ff6fa6);--fg:#fff;--key:linear-gradient(#ffffff,#ffd9e8);--keyfg:#d3306f;--keysh:#c9507f;--accent:#ff3d8b;--bezel:#2a0a18;--bezelring:#fff;--lcd:repeating-linear-gradient(0deg,#0000 0 2px,#ff90c01c 2px 3px),repeating-linear-gradient(90deg,#0000 0 2px,#ff90c01c 2px 3px);--osd:#ffe3f0;--r:26px;}
body[data-skin=c1]{--body:linear-gradient(160deg,#e2e5ea,#9ba0a9 60%,#c7cad0);--fg:#222;--key:linear-gradient(#4a4d55,#25272c);--keyfg:#eee;--keysh:#000;--accent:#e8002d;--bezel:#000;--bezelring:#555;--lcd:none;--osd:#fff;--r:12px;}
body[data-skin=c2]{--body:radial-gradient(circle at 30% 20%,#2a2a2a,#0e0e0e);--fg:#ddd;--key:linear-gradient(#3b3b3b,#1d1d1d);--keyfg:#ddd;--keysh:#000;--accent:#ff4a1c;--bezel:#000;--bezelring:#333;--lcd:none;--osd:#fff;--r:10px;}
body[data-skin=v1]{--body:linear-gradient(160deg,#9fb0c4,#6d7d92 55%,#8d9bb0);--fg:#1d2733;--key:linear-gradient(#e9eef5,#b7c1cf);--keyfg:#1f2b3a;--keysh:#4c5a6d;--accent:#ff3b30;--bezel:#000;--bezelring:#3a4658;--lcd:repeating-linear-gradient(0deg,#0000 0 2px,#0000001f 2px 3px);--osd:#fff;--r:16px;}
body[data-skin=v2]{--body:linear-gradient(160deg,#25272c,#0d0e10);--fg:#cfd3d8;--key:linear-gradient(#41444b,#202226);--keyfg:#d9dde2;--keysh:#000;--accent:#39ff7a;--bezel:#000;--bezelring:#4a4d54;--lcd:repeating-linear-gradient(0deg,#0000 0 2px,#00000055 2px 3px);--osd:#7dffa6;--r:8px;}

/* ================= 本体 ================= */
#device{position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--body);color:var(--fg);
  box-shadow:0 0 0 2px #0008,0 20px 60px #000c;}
/* ガラケー: 縦長・上半分が画面 */
body[data-kind=g] #device{height:100dvh;width:min(100vw,50dvh);}
@media (min-width:600px){body[data-kind=g] #device{border-radius:34px 34px 60px 60px;height:min(100dvh,900px);}}
/* デジカメ/ビデオ: 横長なら画面+右側ボタン、縦長なら画面の下にボタン */
body:not([data-kind=g]) #device{width:min(100vw,1100px);height:100dvh;flex-direction:row;}
@media (orientation:portrait){body:not([data-kind=g]) #device{flex-direction:column;}}
@media (min-width:900px) and (min-height:600px){body:not([data-kind=g]) #device{height:min(100dvh,760px);border-radius:var(--r);}}

#screenBox{position:relative;padding:14px;display:flex;flex-direction:column;min-height:0;min-width:0;}
body[data-kind=g] #screenBox{flex:0 0 47%;padding:calc(30px + env(safe-area-inset-top)) 16px 8px;}
body:not([data-kind=g]) #screenBox{flex:1;padding:calc(12px + env(safe-area-inset-top)) 12px 12px;}
body[data-kind=g] #screenBox::before{ /* スピーカー */
  content:"";position:absolute;top:calc(12px + env(safe-area-inset-top));left:50%;width:56px;height:6px;margin-left:-28px;border-radius:3px;
  background:repeating-linear-gradient(90deg,#0009 0 3px,#0003 3px 5px);}
#bezel{position:relative;flex:1;min-height:0;border-radius:8px;overflow:hidden;background:var(--bezel);padding:5px;
  box-shadow:0 0 0 3px var(--bezelring),inset 0 0 12px #000;}
body[data-skin=g3] #bezel{border-radius:16px;}
body[data-skin=v2] #bezel{border-radius:40% / 12%;padding:10px;} /* ビューファインダー風 */
#vf{position:relative;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;border-radius:inherit;}
#vf::after{content:"";position:absolute;inset:0;pointer-events:none;background:var(--lcd);z-index:2;}
body[data-skin=v2] #vf::after{box-shadow:inset 0 0 50px #000;}
canvas#canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3;}
#flash.go{animation:fl .28s ease-out;}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
#shutterBlack{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:3;}
#shutterBlack.go{animation:sb .16s linear;}
@keyframes sb{0%{opacity:0}30%{opacity:1}70%{opacity:1}100%{opacity:0}}
#focus{position:absolute;width:56px;height:56px;border:1.5px solid var(--osd);pointer-events:none;opacity:0;z-index:4;transform:translate(-50%,-50%) scale(1.4);}
#focus.go{animation:fo 1.1s ease-out;}
@keyframes fo{0%{opacity:1;transform:translate(-50%,-50%) scale(1.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
#grid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;z-index:2;
  background:
   linear-gradient(90deg,transparent 33.2%,#fff6 33.3%,transparent 33.5%,transparent 66.5%,#fff6 66.6%,transparent 66.8%),
   linear-gradient(transparent 33.2%,#fff6 33.3%,transparent 33.5%,transparent 66.5%,#fff6 66.6%,transparent 66.8%);}
#grid.on{opacity:1}

/* ---- 画面上の表示(OSD) ---- */
#osd{position:absolute;inset:0;z-index:5;pointer-events:none;color:var(--osd);font-family:'Orbitron','Press Start 2P',monospace;font-size:10px;
  text-shadow:1px 1px 0 #000,0 0 3px #000;}
.osdTop,.osdBot{position:absolute;left:7px;right:7px;display:flex;justify-content:space-between;align-items:center;gap:6px;}
.osdTop{top:6px}.osdBot{bottom:6px}
.osdL{display:flex;align-items:center;gap:6px;}
#lookName{font-weight:700;letter-spacing:.1em;}
#recChip{display:none;align-items:center;gap:5px;color:#fff;background:var(--rec);padding:1px 6px;border-radius:3px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:none;}
#recChip i{width:7px;height:7px;border-radius:50%;background:#fff;animation:bl 1s steps(2) infinite;}
@keyframes bl{50%{opacity:.1}}
body.recording #recChip{display:flex}
.o-g,.o-c,.o-v{display:none}
body[data-kind=g] .o-g,body[data-kind=c] .o-c,body[data-kind=v] .o-v{display:inline}
.soft{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-weight:700;font-size:11px;}
#osdInfo{font-variant-numeric:tabular-nums;}
body[data-kind=v] #vtape{color:#fff}

/* ---- ボタン類 ---- */
#body{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0;}
body[data-kind=g] #body{flex:1;padding:4px 14px calc(14px + env(safe-area-inset-bottom));justify-content:space-between;}
body:not([data-kind=g]) #body{padding:14px 14px calc(14px + env(safe-area-inset-bottom));}
@media (orientation:landscape){body:not([data-kind=g]) #body{width:250px;flex:none;overflow-y:auto;justify-content:center;}}
@media (orientation:portrait){body:not([data-kind=g]) #body{width:100%;}}
#brand{font-size:10px;letter-spacing:.14em;font-weight:700;opacity:.8;font-family:'Orbitron',sans-serif;text-align:center;}
body[data-skin=g3] #brand{color:#fff;text-shadow:0 1px 0 #c9507f;}
body[data-skin=v2] #brand{color:#7dffa6;}
.key{margin:0;border:0;background:var(--key);color:var(--keyfg);border-radius:10px;font-weight:700;cursor:pointer;
  box-shadow:0 2px 0 var(--keysh),inset 0 1px 0 #fff5;padding:0;}
.key:active{transform:translateY(2px);box-shadow:0 0 0 var(--keysh);}
.key.on{outline:2px solid var(--accent);color:var(--accent);}
#cvPanel,#gPanel{display:flex;flex-direction:column;align-items:center;width:100%;}
body[data-kind=g] #cvPanel,body:not([data-kind=g]) #gPanel{display:none;}
#cvPanel{gap:10px;}

/* コンデジ/ビデオ側 */
.chips{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;}
.chips .key{font-size:12px;padding:7px 11px;border-radius:14px;}
#looks .key{font-size:11px;}
#kind .key{padding:6px 18px;}
#row{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:340px;}
#thumb{width:44px;height:44px;border-radius:8px;border:2px solid var(--keysh);background:#222 center/cover;cursor:pointer;padding:0;margin:0;}
#shutter{width:64px;height:64px;border-radius:50%;border:4px solid var(--accent);position:relative;cursor:pointer;margin:0;padding:0;
  background:var(--key);box-shadow:0 3px 0 var(--keysh);}
#shutter::after{content:"";position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--accent) 70%);transition:all .12s;}
#shutter:active::after{transform:scale(.86);}
body.recording #shutter::after{inset:20px;border-radius:6px;background:var(--rec);}
.round{width:40px;height:40px;border-radius:50%;font-size:20px;}
#mini{display:flex;gap:8px;}

/* ガラケー側 */
#gPanel{gap:8px;flex:1;justify-content:space-between;}
#softRow{display:flex;justify-content:space-between;width:100%;gap:10px;}
#softRow .key{flex:1;padding:6px 0;font-size:12px;border-radius:18px;}
#midRow{display:flex;align-items:center;justify-content:space-between;width:100%;}
#midRow .side{width:62px;height:40px;border-radius:20px;font-size:12px;}
#dpad{position:relative;width:128px;height:128px;border-radius:50%;background:var(--key);box-shadow:0 3px 0 var(--keysh),inset 0 2px 0 #fff4;}
#dpad .d{position:absolute;margin:0;border:0;background:transparent;color:var(--keyfg);font-size:15px;width:36px;height:36px;cursor:pointer;opacity:.85;}
#dpad .d:active{opacity:.4;}
#dpad .u{top:3px;left:46px}#dpad .dn{bottom:3px;left:46px}#dpad .l{left:3px;top:46px}#dpad .r{right:3px;top:46px}
#dpad #shutterG{position:absolute;left:34px;top:34px;width:60px;height:60px;border-radius:50%;border:0;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#fff,var(--accent) 80%);box-shadow:0 2px 0 var(--keysh),inset 0 0 0 3px #fff6;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 1px #0008;}
#dpad #shutterG:active{transform:scale(.93);}
body.recording #dpad #shutterG{background:var(--rec);}
#numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:100%;max-width:300px;}
#numpad .key{padding:5px 0 4px;border-radius:12px;font-size:15px;line-height:1.1;display:flex;flex-direction:column;align-items:center;}
#numpad .key small{font-size:8px;font-weight:400;opacity:.75;}
@media (max-height:700px){#numpad .key{padding:2px 0}#dpad{width:110px;height:110px}#dpad .u{left:37px}#dpad .dn{left:37px}#dpad .l{top:37px}#dpad .r{top:37px}#dpad #shutterG{left:25px;top:25px}}

/* ---- シート/ダイアログ ---- */
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;z-index:10;background:#1c1c1eee;color:#fff;backdrop-filter:blur(18px);
  border-radius:20px 20px 0 0;padding:16px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s;max-height:90dvh;overflow:auto;}
#sheet.open{transform:none}
#sheet h3{margin:0 0 12px;font-size:14px;letter-spacing:.1em;}
.set{display:flex;align-items:center;justify-content:space-between;font-size:14px;padding:9px 0;border-top:1px solid #fff2;gap:12px;}
.set input[type=range]{flex:1;max-width:160px;accent-color:#ffd60a;}
.set input[type=checkbox]{width:44px;height:26px;accent-color:#ffd60a;}
.set select{max-width:230px;padding:7px;border-radius:8px;border:0;background:#3a3a3c;color:#fff;font-size:13px;font-family:inherit;}
#aboutBtn,#closeSheet{margin:12px 0 0;width:100%;padding:10px;border:0;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;}
#aboutBtn{background:#3a3a3c;color:#fff;}
#closeSheet{background:#ffd60a;color:#000;}
#about{position:fixed;inset:0;z-index:25;background:#000e;backdrop-filter:blur(10px);color:#fff;display:none;flex-direction:column;
  padding:calc(20px + env(safe-area-inset-top)) max(20px,calc(50% - 360px));overflow-y:auto;user-select:text;-webkit-user-select:text;}
#about.open{display:flex}
#about h3{margin:18px 0 8px;font-size:13px;letter-spacing:.1em;color:#ffd60a;}
#about h2{margin:0;font-size:20px;}
#about .ver{font-size:12px;color:#aaa;margin-top:4px}
#about ul{margin:0;padding:0;list-style:none;font-size:13px;line-height:1.6}
#about li{padding:8px 0;border-top:1px solid #fff2}
#about li b{display:block;color:#fff}
#about li span{color:#bbb}
#about a{color:#6cf;word-break:break-all}
#aboutClose{margin:20px 0 0;padding:11px;border:0;border-radius:12px;background:#ffd60a;color:#000;font-weight:700;font-size:14px;cursor:pointer;flex:none;}
#preview{position:fixed;inset:0;z-index:20;background:#000;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
#preview.open{display:flex}
#preview img,#preview video{max-width:100%;max-height:78%;object-fit:contain;}
#preview .btns{display:flex;gap:12px}
#preview a,#preview button{margin:0;padding:11px 22px;border-radius:22px;border:0;background:#ffd60a;color:#000;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer;}
#preview button{background:#333;color:#fff}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:30;background:#000c;color:#fff;padding:8px 16px;
  border-radius:16px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:90%;}
#toast.on{opacity:1}
</style>
</head>

<body data-skin="g1" data-kind="g">
<div id="device">
  <div id="screenBox"><div id="bezel"><div id="vf">

      <div class="osdTop">
        <div class="osdL"><span id="lookName">CCD</span><span id="recChip"><i></i><span id="timecode">00:00</span></span></div>

  </div></div></div>

  <div id="body">
    <div id="brand"></div>

    <!-- デジカメ・ビデオカメラ用の操作部 -->
    <div id="cvPanel">
      <div id="ratio" class="chips">
        <button class="key" data-act="ratio:16:9">16:9</button><button class="key" data-act="ratio:4:3">4:3</button><button class="key" data-act="ratio:1:1">1:1</button><button class="key" data-act="ratio:FULL">全画面</button>
      </div>
      <div id="zoomPill" class="chips">
        <button class="key" data-act="zoomN:1">1×</button><button class="key" data-act="zoomN:2">2×</button><button class="key" data-act="zoomN:4">4×</button>
      </div>
      <div id="looks" class="chips"></div>
      <div id="kind" class="chips">
        <button class="key" data-act="kind:photo">写真</button><button class="key" data-act="kind:video">ビデオ</button>
      </div>

        <button id="thumb" data-act="thumb" aria-label="最後の撮影"></button>
        <button id="shutter" data-act="shutter" aria-label="シャッター"></button>
        <div id="mini">
          <button class="key round" data-act="flip" aria-label="カメラ切替">⟲</button>
          <button class="key round" data-act="gear" aria-label="設定">⚙</button>
        </div>
      </div>
    </div>

    <!-- ガラケー用のキーパッド -->
    <div id="gPanel">
      <div id="softRow"><button class="key" data-act="gear">メニュー</button><button class="key" data-act="grid">グリッド</button></div>
      <div id="midRow">
        <button class="key side" data-act="kindToggle">写真/動画</button>

<script>
(async()=>{
const $=id=>document.getElementById(id);
const video=$("video"),canvas=$("canvas"),ctx=canvas.getContext("2d",{willReadFrequently:true});
const low=document.createElement("canvas"),lctx=low.getContext("2d",{willReadFrequently:true});

const LOOKS={
  ccd:{name:"CCD",label:"CCD コンデジ(2002)",fps:24},
  cmos:{name:"CMOS",label:"CMOS ケータイ(2008)",fps:24},
  "8mm":{name:"8ミリ風",label:"8ミリフィルム風",fps:12},
  vhs:{name:"アナログテープ",label:"アナログテープ(ホームビデオ風)",fps:15},
  dv:{name:"デジタルテープ",label:"デジタルテープ(ハンディ型風)",fps:30,hiss:.35}
};
LOOKS.ccd.hiss=.5;LOOKS.cmos.hiss=.4;LOOKS["8mm"].hiss=1.2;LOOKS.vhs.hiss=1;
let look="ccd",kind="photo",facing="environment",zoom=1,recording=false;
let stream=null,recorder=null,blobs=[],recStartTime=0,lastURL=null,lastKind=null;
let LW=240,LH=320,SC=2;

/* ================= 音（WebAudio合成） ================= */
let actx=null;
function audio(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(actx&&actx.state==="suspended")actx.resume();
  return actx;
}
const soundOn=()=>$("sound").checked;
function noiseBuf(a,dur){
  const n=a.sampleRate*dur|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  return b;
}
function click(a,t,freq,dur,vol,lowthump){
  const s=a.createBufferSource();s.buffer=noiseBuf(a,dur);
  const hp=a.createBiquadFilter();hp.type="bandpass";hp.frequency.value=freq;hp.Q.value=0.8;
  const g=a.createGain();g.gain.value=vol;
  s.connect(hp).connect(g).connect(a.destination);s.start(t);
  if(lowthump){
    const o=a.createOscillator(),og=a.createGain();
    o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(70,t+0.05);
    og.gain.setValueAtTime(vol*0.7,t);og.gain.exponentialRampToValueAtTime(0.001,t+0.06);
    o.connect(og).connect(a.destination);o.start(t);o.stop(t+0.07);
  }
}
function playShutter(){ // カシャッ：開く＋閉じる
  if(!soundOn())return;const a=audio();if(!a)return;const t=a.currentTime;
  if(look==="cmos"){ // 電子的なシャッター
    click(a,t,3200,0.03,0.5,false);
    const o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.value=1200;
    g.gain.setValueAtTime(0.0001,t+0.03);g.gain.linearRampToValueAtTime(0.12,t+0.035);g.gain.exponentialRampToValueAtTime(0.001,t+0.09);
    o.connect(g).connect(a.destination);o.start(t+0.03);o.stop(t+0.1);
  }else{
    click(a,t,2600,0.045,0.9,true);
    click(a,t+0.085,1800,0.06,0.7,true);
  }
}
function beep(t0,dur,freq){
  const a=audio();if(!a)return;const t=a.currentTime+t0;
  const o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.value=freq||2000;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.16,t+0.004);
  g.gain.setValueAtTime(0.16,t+dur-0.01);g.gain.linearRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+0.01);
}
const beepStart=()=>{if(soundOn())beep(0,0.11,2000);};          // ピッ
const beepStop=()=>{if(soundOn()){beep(0,0.07,2000);beep(0.12,0.07,2000);}}; // ピピッ

/* ================= カメラ ================= */
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2200);}
async function startCamera(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  const withAudio=$("mic").checked;
  const base={video:{facingMode:facing,width:{ideal:1280},height:{ideal:960}}};
  try{
    stream=await navigator.mediaDevices.getUserMedia({...base,audio:withAudio?{echoCancellation:true,noiseSuppression:true}:false});
  }catch(e){
    try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});toast("マイクなしで起動しました");}
    catch(e2){toast("カメラ起動失敗: "+e2.message);return;}
  }
  video.srcObject=stream;video.muted=true;
  try{await video.play();}catch(e){}
}

/* ================= サイズ ================= */
let ratioKey="4:3";
function fitCanvas(){
  const vf=$("vf"),W=vf.clientWidth||360,H=vf.clientHeight||640;
  const portrait=H>W;
  let r;
  if(ratioKey==="FULL")r=W/H;                  // 画面にぴったり(縦長スマホ・PC画面向け)
  else{const [rw,rh]=ratioKey.split(":").map(Number);r=portrait?rh/rw:rw/rh;}                 // 画面の向きに合わせて 9:16 / 3:4 も自動で
  // 表示サイズ(画面に収まる最大)
  let cw=W,ch=W/r;if(ch>H){ch=H;cw=H*r;}
  for(const el of[canvas,$("grid")]){el.style.width=cw+"px";el.style.height=ch+"px";}
  if(recording)return;
  // 内部解像度(レトロ感のため低解像度のまま)
  if(r>=1){LH=240;LW=Math.round(240*r/2)*2;}else{LW=240;LH=Math.round(240/r/2)*2;}
  SC=2;
  low.width=LW;low.height=LH;canvas.width=LW*SC;canvas.height=LH*SC;
  initFixed();
}
let colFPN,hotPix,rowNoise;
function initFixed(){
  colFPN=new Float32Array(LW);for(let x=0;x<LW;x++)colFPN[x]=(Math.random()-.5)*5;
  rowNoise=new Float32Array(LH);
  hotPix=[];for(let i=0;i<14;i++)hotPix.push([Math.random()*LW|0,Math.random()*LH|0,120+Math.random()*135]);
  prevCol=null;smear=new Float32Array(LW);
}
let prevCol=null,smear=null,skew=0,vigTab=null;
window.addEventListener("resize",fitCanvas);
if(window.ResizeObserver)new ResizeObserver(()=>fitCanvas()).observe($("vf"));

/* ================= デジタルテープ風 : WebGL シェーダー ================= */
// 4:2:0 クロマサブサンプリング(2x2で色を共有)＋横方向の色にじみ＋DCTブロック風の量子化、
// さらに数フレームだけ発生するデジタルバグ(マクロブロック欠落/固着/色ズレ)。
const DV_VS=`attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const DV_FS=`precision highp float;
varying vec2 v;
uniform sampler2D uTex,uPrev;
uniform vec4 uRect;      // 切り出し(ズーム) x,y,w,h
uniform vec2 uRes;       // 出力解像度(px)
uniform float uTime,uNoise,uGlitch,uSeed,uBlock;
float h21(vec2 q){q=fract(q*vec2(123.34,456.21));q+=dot(q,q+45.32);return fract(q.x*q.y);}
vec3 cam(vec2 px){return texture2D(uTex,uRect.xy+uRect.zw*(px/uRes)).rgb;}
vec3 rgb2yuv(vec3 c){return vec3(dot(c,vec3(.299,.587,.114)),dot(c,vec3(-.169,-.331,.5)),dot(c,vec3(.5,-.419,-.081)));}
vec3 yuv2rgb(vec3 y){return vec3(y.x+1.402*y.z,y.x-.344*y.y-.714*y.z,y.x+1.772*y.y);}
// 4:2:0: 輝度は画素ごと、色差は2x2ブロックの平均＋横にもう少し滲ませる
vec3 dvDecode(vec2 px){
  vec2 f=floor(px);
  float Y=rgb2yuv(cam(f+.5)).x;
  vec2 b=floor(f/2.)*2.;
  vec2 uv=vec2(0.);
  for(int i=-1;i<=2;i++){           // 横4画素分(=ブロック2つ分に少し跨る)
    for(int j=0;j<2;j++){
      float w=(i==-1||i==2)?.5:1.;
      vec3 t=rgb2yuv(cam(b+vec2(float(i),float(j))+.5));
      uv+=t.yz*w;
    }
  }
  uv/=6.;
  return yuv2rgb(vec3(Y,uv));
}
void main(){
  vec2 px=v*uRes;
  vec3 col=dvDecode(px);
  // DCT風: ブロックごとに輝度を軽く量子化＋ブロック境界のわずかな段差
  vec2 bk=floor(px/uBlock);
  float bn=h21(bk+7.)*.04-.02;
  col+=bn*.6;
  col=floor(col*48.+.5)/48.;
  // 色を濃く、やや鮮鋭に
  float l=dot(col,vec3(.299,.587,.114));
  col=mix(vec3(l),col,1.18);col=(col-.5)*1.06+.5;
  // 微小なテープ/CCDノイズ
  col+=(h21(px+uTime)-.5)*uNoise*.12;
  // ---- デジタルバグ ----
  if(uGlitch>0.){
    vec2 gb=floor(px/uBlock);
    float r=h21(gb+uSeed);
    float band=step(.55,h21(vec2(floor(px.y/(uBlock*3.)),uSeed)));   // 横帯状に壊れやすい
    float th=uGlitch*(.10+.25*band);
    if(r<th*.45){                       // 前フレーム固着
      col=texture2D(uPrev,v).rgb;
    }else if(r<th*.75){                 // DC成分のみ(べた塗り)＋色ズレ
      vec3 m=dvDecode((gb+.5)*uBlock);
      vec3 y=rgb2yuv(m);y.yz+=(vec2(h21(gb+1.3),h21(gb+2.7))-.5)*.7;
      col=yuv2rgb(y);
    }else if(r<th){                     // 別ブロックの内容が混入
      vec2 o=(vec2(h21(gb+3.1),h21(gb+5.9))-.5)*12.*uBlock;
      col=dvDecode(px+o);
    }
  }
  gl_FragColor=vec4(clamp(col,0.,1.),1.);
}`;
let glc=null,gl=null,glProg=null,glTex=null,glPrev=null,glU={};
function initGL(){
  try{
    glc=document.createElement("canvas");
    gl=glc.getContext("webgl",{preserveDrawingBuffer:true,antialias:false});
    if(!gl)return false;
    const sh=(t,src)=>{const o=gl.createShader(t);gl.shaderSource(o,src);gl.compileShader(o);
      if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;};
    glProg=gl.createProgram();
    gl.attachShader(glProg,sh(gl.VERTEX_SHADER,DV_VS));gl.attachShader(glProg,sh(gl.FRAGMENT_SHADER,DV_FS));
    gl.linkProgram(glProg);gl.useProgram(glProg);
    const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(glProg,"p");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    for(const n of["uTex","uPrev","uRect","uRes","uTime","uNoise","uGlitch","uSeed","uBlock"])glU[n]=gl.getUniformLocation(glProg,n);
    const mk=()=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t;};
    glTex=mk();glPrev=mk();
    gl.uniform1i(glU.uTex,0);gl.uniform1i(glU.uPrev,1);
    return true;
  }catch(e){console.warn("WebGL init failed",e);gl=null;return false;}
}
// デジタルバグの発生ロジック：普段は出ず、まれに2〜6フレームだけ発生する
let bugLeft=0,bugStrength=0,bugSeed=0;
function updateBug(k){
  if(bugLeft<=0&&Math.random()<(.004+.012*k)){      // 平均 数秒に1回程度(60fps換算)
    bugLeft=2+(Math.random()*5|0);bugStrength=.35+Math.random()*.65;
  }
  if(bugLeft>0){bugLeft--;bugSeed=Math.random()*100;return bugStrength*(bugLeft===0?.5:1);}
  return 0;
}
function drawDV(k,sx,sy,sw,sh,vw,vh){
  if(glc.width!==LW||glc.height!==LH){glc.width=LW;glc.height=LH;}
  gl.viewport(0,0,LW,LH);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,glTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,video);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,glPrev);
  gl.uniform4f(glU.uRect,sx/vw,sy/vh,sw/vw,sh/vh);
  gl.uniform2f(glU.uRes,LW,LH);gl.uniform1f(glU.uTime,frameN%1000*.1);
  gl.uniform1f(glU.uNoise,k);gl.uniform1f(glU.uBlock,6);
  const g=updateBug(k);
  gl.uniform1f(glU.uGlitch,g);gl.uniform1f(glU.uSeed,bugSeed);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  // 今フレームを「前フレーム」として保存(固着ブロック用)
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,glPrev);
  gl.copyTexImage2D(gl.TEXTURE_2D,0,gl.RGBA,0,0,LW,LH,0);
  lctx.drawImage(glc,0,0);
}

/* ================= 画像処理 ================= */
const clamp=v=>v<0?0:v>255?255:v;
let frameN=0;
function amount(){return $("tape").value/100;}

function processCCD(d,w,h,k){
  // 垂直スミア：強い光源の縦方向への漏れ（CCD特有）
  smear.fill(0);
  for(let y=0;y<h;y+=2)for(let x=0;x<w;x++){const i=(y*w+x)*4;const l=(d[i]+d[i+1]+d[i+2])/3;if(l>225)smear[x]+=(l-225);}
  for(let x=0;x<w;x++)smear[x]=Math.min(70,smear[x]/(h/2)*5*(0.5+k));
  const cx=w/2,cy=h/2,mx=cx*cx+cy*cy;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    let r=d[i],g=d[i+1],b=d[i+2];
    let l=(r+g+b)/3;
    // 彩度＆コントラスト（CCDの濃い発色）
    r=l+(r-l)*(1.2+.1*k);g=l+(g-l)*(1.2+.1*k);b=l+(b-l)*(1.2+.1*k);
    r=(r-128)*1.1+134;g=(g-128)*1.1+132;b=(b-128)*1.1+138;
    // 色ノイズ（CCDはチャンネルごとに粒状）
    const nl=(Math.random()-.5)*10*k;
    r+=nl+(Math.random()-.5)*14*k;g+=nl+(Math.random()-.5)*14*k;b+=nl+(Math.random()-.5)*14*k;
    // ハイライトのブルーミング（白飛び周辺のにじみ＋パープルフリンジ）
    l=(r+g+b)/3;
    if(l>215){const e=(l-215)/40;r+=e*12;b+=e*26;g+=e*8;}
    const s=smear[x];r+=s*.85;g+=s*.9;b+=s;
    // ビネット
    const dx=x-cx,dy=y-cy,v=1-.28*(dx*dx+dy*dy)/mx;
    d[i]=clamp(r*v);d[i+1]=clamp(g*v);d[i+2]=clamp(b*v);
  }
}

function processCMOS(d,w,h,k){
  // 列方向の固定パターンノイズ、行バンディング、暗部ノイズ
  for(let y=0;y<h;y++)rowNoise[y]=(Math.random()-.5)*7*k;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    let r=d[i],g=d[i+1],b=d[i+2];
    const l=(r+g+b)/3;
    // 強めのコントラスト・ハイライトの硬い白飛び
    r=(r-128)*1.22+126;g=(g-128)*1.22+128;b=(b-128)*1.22+124;
    // 暗部ほど目立つ輝度ノイズ
    const sh=1-l/255,n=(Math.random()-.5)*(6+34*sh*sh)*(.4+k*1.2);
    const f=colFPN[x]*k*1.4+rowNoise[y];
    r+=n+f;g+=n*1.1+f;b+=n*1.3+f;
    // 暗部はグリーン〜シアンかぶり、明部はやや黄色
    if(l<90){g+=(90-l)*.07*(.5+k);r-=(90-l)*.03;}else if(l>180){r+=4;g+=3;b-=5;}
    d[i]=clamp(r);d[i+1]=clamp(g);d[i+2]=clamp(b);
  }
  for(const p of hotPix){ // ホットピクセル
    if(k<.15)break;const i=(p[1]*w+p[0])*4;d[i]=clamp(d[i]+p[2]*k);d[i+1]=clamp(d[i+1]+p[2]*k*.4);
  }
}

function process8mm(d,w,h,k){
  const flick=1+(Math.random()-.5)*.12*(0.5+k);
  const cx=w/2,cy=h/2,mx=cx*cx+cy*cy;
  const sx=Math.random()*w|0,hasScr=Math.random()<.18*k;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    let r=d[i],g=d[i+1],b=d[i+2];const a=(r+g+b)/3;
    const n=(Math.random()-.5)*(18+30*k);
    r=r*.93+a*.07;g=g*.89+a*.11;b=b*.85+a*.15;
    r=r*1.08+n+10;g=g*1.0+n*.8+4;b=b*.82+n*.9-4;
    const dx=x-cx,dy=y-cy,v=1-.45*(dx*dx+dy*dy)/mx;
    r*=v*flick;g*=v*flick;b*=v*flick;
    if(hasScr&&Math.abs(x-sx)<1){r+=70;g+=70;b+=60;}
    d[i]=clamp(r);d[i+1]=clamp(g);d[i+2]=clamp(b);
  }
  // ほこり
  const nd=(Math.random()*6*k)|0;
  for(let q=0;q<nd;q++){const x=Math.random()*(w-3)|0,y=Math.random()*(h-3)|0;
    for(let a=0;a<3;a++)for(let c=0;c<3;c++){const i=((y+a)*w+x+c)*4;d[i]=d[i+1]=d[i+2]=20;}}
}

function processVHS(d,w,h,k){
  const band=((frameN*3)%(h*2))-h*.5; // 流れるトラッキングノイズ帯
  for(let y=0;y<h;y++){
    let cr=0,cb=0;
    const inBand=y>band&&y<band+10*(.5+k);
    const sl=(y%2===0)?.9:1.05;
    for(let x=0;x<w;x++){
      const i=(y*w+x)*4;
      const r=d[i],g=d[i+1],b=d[i+2];
      const l=.3*r+.59*g+.11*b;
      // 色は横方向に滲む（クロマ帯域不足）
      cr+=((r-l)-cr)*.18;cb+=((b-l)-cb)*.18;
      let n=(Math.random()-.5)*(30+40*k);
      if(inBand)n=(Math.random()-.5)*220*(.4+k);
      const L=(l-128)*.9+128+n;
      d[i]=clamp((L+cr*1.1)*sl);d[i+1]=clamp((L-.3*cr-.2*cb)*sl);d[i+2]=clamp((L+cb*1.1)*sl);
    }
  }
}

// CMOSローリングシャッター：パン方向を推定して行ごとにずらす
function estimateSkew(d,w,h){
  const col=new Float32Array(w);
  for(let y=0;y<h;y+=3)for(let x=0;x<w;x++){const i=(y*w+x)*4;col[x]+=d[i+1];}
  if(prevCol){
    let best=0,bs=1e12;
    for(let s=-10;s<=10;s++){let sad=0;
      for(let x=12;x<w-12;x+=2)sad+=Math.abs(col[x]-prevCol[x+s]);
      if(sad<bs){bs=sad;best=s;}}
    skew=skew*.6+best*.4;
  }
  prevCol=col;
}

/* ================= 描画ループ ================= */
function drawDateStamp(){
  if(!$("stamp").checked)return;
  const n=new Date(),p=v=>String(v).padStart(2,"0");
  const t=(look==="vhs"||look==="dv")?`${n.getFullYear()}.${p(n.getMonth()+1)}.${p(n.getDate())}  ${p(n.getHours())}:${p(n.getMinutes())}`
          :`'${String(n.getFullYear()).slice(-2)} ${p(n.getMonth()+1)} ${p(n.getDate())}`;
  ctx.font=`${Math.round(canvas.width/30)}px 'Press Start 2P',monospace`;
  ctx.textAlign="right";ctx.textBaseline="alphabetic";
  const x=canvas.width-canvas.width*.04,y=canvas.height-canvas.height*.035;
  ctx.fillStyle="#ff7a00";ctx.shadowColor="#ff3d0088";ctx.shadowBlur=4;
  if(look==="vhs"||look==="dv"){ctx.fillStyle="#fff";ctx.shadowColor="#0008";}
  ctx.fillText(t,x,y);ctx.shadowBlur=0;
}

function render(){
  frameN++;
  if(video.readyState>=2){
    const vw=video.videoWidth,vh=video.videoHeight;
    const tar=LW/LH,ar=vw/vh;let sw=vw,sh=vh;
    if(ar>tar)sw=vh*tar;else sh=vw/tar;
    sw/=zoom;sh/=zoom;
    const sx=(vw-sw)/2,sy=(vh-sh)/2;
    lctx.drawImage(video,sx,sy,sw,sh,0,0,LW,LH);
    const k=amount();
    if(look==="dv")drawDV(k,sx,sy,sw,sh,vw,vh);
    else{
      const img=lctx.getImageData(0,0,LW,LH);
      if(look==="ccd")processCCD(img.data,LW,LH,k);
      else if(look==="cmos"){estimateSkew(img.data,LW,LH);processCMOS(img.data,LW,LH,k);}
      else if(look==="8mm")process8mm(img.data,LW,LH,k);
      else processVHS(img.data,LW,LH,k);
      lctx.putImageData(img,0,0);
    }
    ctx.imageSmoothingEnabled=false;
    ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height);
    if(look==="cmos"&&Math.abs(skew)>.3){ // 行ごとのずれ（ジェロ効果）
      for(let y=0;y<LH;y++){
        const off=skew*(y/LH-.5)*1.6*SC;
        ctx.drawImage(low,0,y,LW,1,off,y*SC,canvas.width,SC);
      }
    }else if(look==="vhs"){
      for(let y=0;y<LH;y++){
        let off=0;const fromBot=LH-y;
        if(fromBot<10)off=(10-fromBot)*(Math.sin(frameN*.7+y)*1.2+1.5)*amount()*SC*.8;
        off+=(Math.random()-.5)*.8*amount()*SC;
        ctx.drawImage(low,0,y,LW,1,off,y*SC,canvas.width,SC);
      }
    }else ctx.drawImage(low,0,0,canvas.width,canvas.height);
    drawDateStamp();
  }
  if(recording){
    const s=Math.floor((Date.now()-recStartTime)/1000);
    $("timecode").textContent=`${String(s/60|0).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  }
  requestAnimationFrame(render);
}

/* ================= 撮影 ================= */
function setThumb(url,k){
  lastURL=url;lastKind=k;
  if(k==="photo")$("thumb").style.backgroundImage=`url(${url})`;
  else{
    const c=document.createElement("canvas");c.width=104;c.height=104;
    const x=c.getContext("2d");const s=Math.min(canvas.width,canvas.height);
    x.drawImage(canvas,(canvas.width-s)/2,(canvas.height-s)/2,s,s,0,0,104,104);
    $("thumb").style.backgroundImage=`url(${c.toDataURL("image/jpeg",.7)})`;
  }
}
function takePhoto(){
  playShutter();
  $("shutterBlack").classList.remove("go");void $("shutterBlack").offsetWidth;$("shutterBlack").classList.add("go");
  if(look==="ccd"){$("flash").classList.remove("go");void $("flash").offsetWidth;$("flash").classList.add("go");}
  canvas.toBlob(blob=>{
    const url=URL.createObjectURL(blob);
    setThumb(url,"photo");
    const a=document.createElement("a");a.href=url;a.download=`heisei_${look}_${Date.now()}.jpg`;a.click();
  },"image/jpeg",0.92);
}
/* ================= テープ素材風オーディオ合成 =================
   マイク → (帯域制限・軽い飽和・ワウフラッター) → 録音用ノード
   ＋ ホワイトノイズ(ヒス) ＋ ときどきのドロップアウト/ポップ を合成して録音する。
   プレビューは無音のまま。 */
let tapeNodes=null;
function buildTapeAudio(){
  const a=audio();if(!a)return null;
  const dest=a.createMediaStreamDestination();
  const nodes=[];const add=n=>{nodes.push(n);return n;};
  const k=amount(),hissF=LOOKS[look].hiss??1;
  const lpf=look==="vhs"?9000:look==="8mm"?7000:look==="dv"?15000:12000;
  const mic=stream&&stream.getAudioTracks()[0];
  if(mic){
    const src=add(a.createMediaStreamSource(new MediaStream([mic])));
    const hp=add(a.createBiquadFilter());hp.type="highpass";hp.frequency.value=90;
    const lp=add(a.createBiquadFilter());lp.type="lowpass";lp.frequency.value=lpf;
    const ws=add(a.createWaveShaper());           // テープ飽和(tanh)
    const c=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/512-1;c[i]=Math.tanh(x*(1.2+k*1.5));}
    ws.curve=c;
    const dl=add(a.createDelay(0.05));dl.delayTime.value=.01;  // ワウ・フラッター
    const lfo=add(a.createOscillator()),lg=add(a.createGain());
    lfo.frequency.value=.8+k*3;lg.gain.value=.0004+.0012*k*hissF;lfo.connect(lg).connect(dl.delayTime);lfo.start();
    src.connect(hp);hp.connect(lp);lp.connect(ws);ws.connect(dl);dl.connect(dest);
  }
  // ホワイトノイズ(2秒ループ)＋高域寄りフィルタ＝テープヒス
  const len=a.sampleRate*2,nb=a.createBuffer(1,len,a.sampleRate),d=nb.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const ns=add(a.createBufferSource());ns.buffer=nb;ns.loop=true;
  const nhp=add(a.createBiquadFilter());nhp.type="highpass";nhp.frequency.value=1200;
  const nlp=add(a.createBiquadFilter());nlp.type="lowpass";nlp.frequency.value=Math.min(lpf,10000);
  const hiss=add(a.createGain());
  const base=(.006+.07*k)*hissF;hiss.gain.value=base;
  ns.connect(nhp);nhp.connect(nlp);nlp.connect(hiss);hiss.connect(dest);ns.start();
  // 低域ハム(ごく小さく)
  const hum=add(a.createOscillator()),hg=add(a.createGain());hum.frequency.value=60;hg.gain.value=.002+.01*k*hissF;
  hum.connect(hg).connect(dest);hum.start();
  // 不規則なヒス変動・ドロップアウト・ポップノイズ
  const timer=setInterval(()=>{
    const t=a.currentTime;
    hiss.gain.setTargetAtTime(base*(.8+Math.random()*.5),t,.2);
    if(Math.random()<.04*(.3+k)){ // 瞬間的な音量落ち込みと復帰
      const m=nodes.find(n=>n instanceof WaveShaperNode);
      hiss.gain.setValueAtTime(base*3,t);hiss.gain.setTargetAtTime(base,t+.03,.05);
    }
    if(Math.random()<.05*(.3+k)){ // プチッというポップ
      const pb=a.createBuffer(1,a.sampleRate*.012|0,a.sampleRate),pd=pb.getChannelData(0);
      for(let i=0;i<pd.length;i++)pd[i]=(Math.random()*2-1)*Math.pow(1-i/pd.length,2);
      const ps=a.createBufferSource(),pg=a.createGain();ps.buffer=pb;pg.gain.value=.2+.3*k;ps.connect(pg).connect(dest);ps.start(t);
    }
  },250);
  return {track:dest.stream.getAudioTracks()[0],stop(){clearInterval(timer);
    nodes.forEach(n=>{try{n.stop&&n.stop();}catch(e){}try{n.disconnect();}catch(e){}});}};
}

function startRec(){
  blobs=[];
  beepStart();
  const fps=LOOKS[look].fps;
  const cs=canvas.captureStream(fps);
  tapeNodes=null;
  try{tapeNodes=buildTapeAudio();}catch(e){console.warn(e);}
  if(tapeNodes)cs.addTrack(tapeNodes.track);
  else{const at=stream&&stream.getAudioTracks()[0];if(at)cs.addTrack(at);}
  const types=["video/webm;codecs=vp8,opus","video/webm","video/mp4"];
  const mt=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
  try{recorder=new MediaRecorder(cs,mt?{mimeType:mt}:undefined);}catch(e){toast("録画に対応していません");return;}
  recorder.ondataavailable=e=>{if(e.data.size>0)blobs.push(e.data);};
  recorder.onstop=()=>{
    if(tapeNodes){tapeNodes.stop();tapeNodes=null;}
    const type=recorder.mimeType||"video/webm";
    const url=URL.createObjectURL(new Blob(blobs,{type}));
    setThumb(url,"video");lastURL=url;lastKind="video";
    lastExt=type.includes("mp4")?"mp4":"webm";
    openPreview();
  };
  setTimeout(()=>{ // ピッ音が録音に入らないよう少し待つ
    recStartTime=Date.now();recorder.start(100);
  },160);
  recording=true;document.body.classList.add("recording");refreshUI();
}
let lastExt="webm";
function stopRec(){
  if(!recording)return;
  recording=false;document.body.classList.remove("recording");refreshUI();
  if(recorder&&recorder.state!=="inactive")recorder.stop();
  beepStop();
}
function shutterAct(){
  audio();
  if(kind==="photo")takePhoto();
  else recording?stopRec():startRec();
}

  g1:{k:"g",look:"cmos",brand:"HEISEI  W-CAM 130"},
  g2:{k:"g",look:"cmos",brand:"HEISEI  ◉ 2.0 MEGA"},
  g3:{k:"g",look:"cmos",brand:"✦ HEISEI ✦ pretty cam"},
  c1:{k:"c",look:"ccd",brand:"HEISEI DIGITAL  3.2 MEGA PIXELS"},
  c2:{k:"c",look:"ccd",brand:"HEISEI ZOOM 10x  5.0MP"},
  v1:{k:"v",look:"dv",brand:"HEISEI DIGITAL TAPE CAM"},
  v2:{k:"v",look:"vhs",brand:"HEISEI ANALOG TAPE CAM"}
};
let skin="g1";
const looksEl=$("looks");
if(!initGL())delete LOOKS.dv;
for(const k in LOOKS){
  const b=document.createElement("button");b.className="key";b.textContent=LOOKS[k].label;b.dataset.act="look:"+k;
  looksEl.appendChild(b);
}
function selectLook(k){
  if(recording||!LOOKS[k])return;
  look=k;prevCol=null;skew=0;
  if((k==="8mm"||k==="vhs")&&kind==="photo")toast(LOOKS[k].name+"：ビデオ向けの質感です");
  refreshUI();
}
function cycleLook(d){const ks=Object.keys(LOOKS);selectLook(ks[(ks.indexOf(look)+d+ks.length)%ks.length]);}
function setKind(k){if(recording)return;kind=k;refreshUI();}
function setRatio(r){if(recording)return;ratioKey=r;refreshUI();fitCanvas();}
function setZoom(z){zoom=Math.max(1,Math.min(6,z));refreshUI();}
function toggleGrid(){$("grid").classList.toggle("on");}
async function flipCam(){if(recording)return;facing=facing==="environment"?"user":"environment";await startCamera();}
function refreshUI(){
  document.body.classList.toggle("video",kind==="video");
  $("lookName").textContent=LOOKS[look].name;
  document.querySelectorAll("[data-act]").forEach(el=>{
    const a=el.dataset.act;let on=null;
    if(a.startsWith("look:"))on=a.slice(5)===look;
    else if(a.startsWith("ratio:"))on=a.slice(6)===ratioKey;
    else if(a.startsWith("kind:"))on=a.slice(5)===kind;
    else if(a.startsWith("zoomN:"))on=+a.slice(6)===Math.round(zoom)&&Math.abs(zoom-Math.round(zoom))<.15;
    else if(a==="grid")on=$("grid").classList.contains("on");
    if(on!==null&&el.classList.contains("key"))el.classList.toggle("on",on);
  });
  $("osdInfo").textContent=`${ratioKey==="FULL"?"FULL":ratioKey} ×${zoom.toFixed(1)}`;
  $("osdRes").textContent=`AUTO ${LW}×${LH}`;
  $("osdVid").textContent=recording?"● REC":"STBY";
  $("shutterG").textContent=kind==="video"?(recording?"停止":"録画"):"撮影";
}
function act(a){
  if(a==="shutter")shutterAct();
  else if(a==="gear")$("sheet").classList.add("open");
  else if(a==="about"){$("sheet").classList.remove("open");$("about").classList.add("open");}
  else if(a==="grid"){toggleGrid();refreshUI();}
  else if(a==="flip")flipCam();
  else if(a==="thumb")openPreview();
  else if(a==="look+")cycleLook(1);
  else if(a==="look-")cycleLook(-1);
  else if(a==="zoom+")setZoom(zoom+.5);
  else if(a==="zoom-")setZoom(zoom-.5);
  else if(a==="kindToggle")setKind(kind==="photo"?"video":"photo");
  else if(a.startsWith("zoomN:"))setZoom(+a.slice(6));
  else if(a.startsWith("look:"))selectLook(a.slice(5));
  else if(a.startsWith("kind:"))setKind(a.slice(5));
  else if(a.startsWith("ratio:"))setRatio(a.slice(6));
}
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el)act(el.dataset.act);});
// PCキーボード: Enter/Space=撮影, ←→=ルック, ↑↓=ズーム
document.addEventListener("keydown",e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.target.tagName==="BUTTON"&&(e.key===" "||e.key==="Enter"))return;
  const m={Enter:"shutter"," ":"shutter",ArrowLeft:"look-",ArrowRight:"look+",ArrowUp:"zoom+",ArrowDown:"zoom-"}[e.key];
  if(m){e.preventDefault();act(m);}
});

function applySkin(id,resetLook){
  const d=SKINS[id];if(!d)return;
  skin=id;document.body.dataset.skin=id;document.body.dataset.kind=d.k;
  $("brand").textContent=d.brand;$("skin").value=id;
  try{localStorage.setItem("heisei_skin",id);}catch(e){}
  if(resetLook){if(LOOKS[d.look])look=d.look;kind=d.k==="v"?"video":"photo";prevCol=null;skew=0;}
  refreshUI();
  requestAnimationFrame(fitCanvas);
}
$("skin").onchange=e=>{if(recording){$("skin").value=skin;return;}applySkin(e.target.value,true);};
$("closeSheet").onclick=()=>$("sheet").classList.remove("open");
$("aboutBtn").onclick=()=>act("about");
$("mic").onchange=()=>{if(!recording)startCamera();};
setInterval(()=>{const n=new Date(),p=v=>String(v).padStart(2,"0");$("osdClock").textContent=`${p(n.getHours())}:${p(n.getMinutes())}`;},1000);

// タップでフォーカス枠、ピンチでズーム
const vf=$("vf");let pinch=null;
vf.addEventListener("pointerdown",e=>{
  const r=vf.getBoundingClientRect(),f=$("focus");
  f.style.left=(e.clientX-r.left)+"px";f.style.top=(e.clientY-r.top)+"px";
  f.classList.remove("go");void f.offsetWidth;f.classList.add("go");
});
vf.addEventListener("touchmove",e=>{
  if(e.touches.length===2){
    const dd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(pinch)setZoom(zoom*dd/pinch);pinch=dd;e.preventDefault();
  }
},{passive:false});
vf.addEventListener("touchend",()=>pinch=null);

// プレビュー
function openPreview(){
  if(!lastURL)return;
  const body=$("pvBody");body.innerHTML="";
  const el=document.createElement(lastKind==="video"?"video":"img");
  el.src=lastURL;if(lastKind==="video"){el.controls=true;el.autoplay=true;el.playsInline=true;}
  el.style.maxWidth="100%";el.style.maxHeight="70vh";body.appendChild(el);
  const a=$("pvSave");a.href=lastURL;a.download=lastKind==="video"?`heisei_${look}_${Date.now()}.${lastExt}`:`heisei_${look}_${Date.now()}.jpg`;
  $("preview").classList.add("open");
}
$("pvClose").onclick=()=>{$("preview").classList.remove("open");$("pvBody").innerHTML="";};

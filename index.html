<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>平成カメラ</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
:root{--acc:#ffd60a;--rec:#ff3b30;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;
  font-family:-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;}
body{display:flex;align-items:center;justify-content:center;}
#phone{position:relative;width:100%;height:100dvh;max-width:430px;max-height:932px;background:#000;
  display:flex;flex-direction:column;overflow:hidden;}
@media (min-width:500px) and (min-height:700px){
  #phone{height:min(100dvh - 24px,900px);border-radius:44px;border:8px solid #1c1c1e;box-shadow:0 0 0 2px #333,0 20px 80px #000a;}
}

/* ---- top bar ---- */
#top{position:absolute;top:0;left:0;right:0;z-index:5;height:calc(54px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 14px 0;display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(#000a,#0000);}
.tbtn{width:38px;height:38px;border-radius:50%;border:0;background:#0006;color:#fff;font-size:18px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;margin:0;padding:0;}
.tbtn.on{background:var(--acc);color:#000;}
#lookName{font-size:12px;font-weight:700;letter-spacing:.08em;padding:5px 12px;border-radius:14px;background:#0007;}
#recChip{display:none;align-items:center;gap:6px;background:var(--rec);padding:4px 10px;border-radius:12px;
  font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}
#recChip i{width:8px;height:8px;border-radius:50%;background:#fff;animation:bl 1s steps(2) infinite;}
@keyframes bl{50%{opacity:.1}}
body.recording #recChip{display:flex}
body.recording #lookName{display:none}

/* ---- viewfinder ---- */
#vf{position:relative;flex:1;min-height:0;background:#000;overflow:hidden;touch-action:none;}
canvas#canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
#flash.go{animation:fl .28s ease-out;}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
#shutterBlack{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;}
#shutterBlack.go{animation:sb .16s linear;}
@keyframes sb{0%{opacity:0}30%{opacity:1}70%{opacity:1}100%{opacity:0}}
#focus{position:absolute;width:74px;height:74px;border:1.5px solid var(--acc);border-radius:4px;
  pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(1.4);}
#focus.go{animation:fo 1.1s ease-out;}
@keyframes fo{0%{opacity:1;transform:translate(-50%,-50%) scale(1.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
#grid{position:absolute;inset:0;pointer-events:none;opacity:.0;transition:opacity .2s;
  background:
   linear-gradient(90deg,transparent 33.2%,#fff5 33.3%,transparent 33.5%,transparent 66.5%,#fff5 66.6%,transparent 66.8%),
   linear-gradient(transparent 33.2%,#fff5 33.3%,transparent 33.5%,transparent 66.5%,#fff5 66.6%,transparent 66.8%);}
#grid.on{opacity:1}
#zoomPill{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px;
  background:#0006;padding:4px;border-radius:22px;z-index:3;}
#zoomPill button{margin:0;border:0;border-radius:50%;width:34px;height:34px;font-size:11px;font-weight:700;
  background:transparent;color:#fff;cursor:pointer;}
#zoomPill button.on{background:#000a;color:var(--acc);}

/* ---- bottom ---- */
#bottom{background:#000;padding:10px 0 calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;}
#looks{display:flex;gap:6px;overflow-x:auto;padding:0 16px;scrollbar-width:none;justify-content:center;}
#looks::-webkit-scrollbar{display:none}
#looks button{margin:0;flex:none;border:0;background:#1c1c1e;color:#bbb;border-radius:16px;padding:7px 13px;
  font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.04em;}
#looks button.on{background:var(--acc);color:#000;}
#kind{display:flex;justify-content:center;gap:26px;font-size:13px;font-weight:700;letter-spacing:.1em;}
#kind span{color:#aaa;cursor:pointer;padding:2px 4px;}
#kind span.on{color:var(--acc);}
#row{display:flex;align-items:center;justify-content:space-around;padding:0 18px;}
#thumb{width:52px;height:52px;border-radius:10px;border:2px solid #444;background:#222 center/cover;cursor:pointer;padding:0;margin:0;}
#shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:transparent;position:relative;cursor:pointer;margin:0;padding:0;}
#shutter::after{content:"";position:absolute;inset:4px;border-radius:50%;background:#fff;transition:all .12s;}
#shutter:active::after{transform:scale(.88);}
body.video #shutter::after{background:var(--rec);}
body.recording #shutter::after{inset:20px;border-radius:8px;background:var(--rec);}
#flip{width:52px;height:52px;border-radius:50%;border:0;background:#1c1c1e;color:#fff;font-size:22px;cursor:pointer;margin:0;padding:0;}

/* ---- settings sheet ---- */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:10;background:#1c1c1ee8;backdrop-filter:blur(18px);
  border-radius:20px 20px 0 0;padding:16px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s;}
#sheet.open{transform:none}
#sheet h3{margin:0 0 12px;font-size:14px;letter-spacing:.1em;}
.set{display:flex;align-items:center;justify-content:space-between;font-size:14px;padding:9px 0;border-top:1px solid #fff2;gap:12px;}
.set input[type=range]{flex:1;max-width:160px;accent-color:var(--acc);}
.set input[type=checkbox]{width:44px;height:26px;accent-color:var(--acc);}
#closeSheet{margin:12px 0 0;width:100%;padding:10px;border:0;border-radius:12px;background:var(--acc);color:#000;font-weight:700;font-size:14px;cursor:pointer;}

/* ---- preview ---- */
#preview{position:absolute;inset:0;z-index:20;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
#preview.open{display:flex}
#preview img,#preview video{max-width:100%;max-height:78%;object-fit:contain;}
#preview .btns{display:flex;gap:12px}
#preview a,#preview button{margin:0;padding:11px 22px;border-radius:22px;border:0;background:var(--acc);color:#000;
  font-weight:700;font-size:14px;text-decoration:none;cursor:pointer;}
#preview button{background:#333;color:#fff}
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:30;background:#000b;padding:8px 16px;
  border-radius:16px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:90%;}
#toast.on{opacity:1}
</style>
</head>

<body>
<div id="phone">
  <div id="top">
    <button class="tbtn" id="gridBtn" title="グリッド">▦</button>
    <div id="lookName">CCD</div>
    <div id="recChip"><i></i><span id="timecode">00:00</span></div>
    <button class="tbtn" id="gearBtn" title="設定">⚙</button>
  </div>

  <div id="vf">
    <canvas id="canvas" width="480" height="640"></canvas>
    <div id="grid"></div>
    <div id="focus"></div>
    <div id="shutterBlack"></div>
    <div id="flash"></div>
    <div id="zoomPill">
      <button data-z="1" class="on">1×</button><button data-z="2">2×</button><button data-z="4">4×</button>
    </div>
  </div>

  <div id="bottom">
    <div id="looks"></div>
    <div id="kind"><span data-k="photo" class="on">写真</span><span data-k="video">ビデオ</span></div>
    <div id="row">
      <button id="thumb" aria-label="最後の撮影"></button>
      <button id="shutter" aria-label="シャッター"></button>
      <button id="flip" aria-label="カメラ切替">⟲</button>
    </div>
  </div>

  <div id="sheet">
    <h3>設定</h3>
    <div class="set"><span>ノイズ・劣化量</span><input type="range" id="tape" min="0" max="100" value="45"></div>
    <div class="set"><span>日付の写し込み</span><input type="checkbox" id="stamp" checked></div>
    <div class="set"><span>🎙 録音</span><input type="checkbox" id="mic" checked></div>
    <div class="set"><span>🔊 シャッター音</span><input type="checkbox" id="sound" checked></div>
    <button id="closeSheet">閉じる</button>
  </div>

  <div id="preview"><div id="pvBody"></div><div class="btns"><a id="pvSave" download>保存</a><button id="pvClose">閉じる</button></div></div>
  <div id="toast"></div>
</div>

<video id="video" autoplay playsinline muted style="display:none;"></video>

<script>
(async()=>{
const $=id=>document.getElementById(id);
const video=$("video"),canvas=$("canvas"),ctx=canvas.getContext("2d",{willReadFrequently:true});
const low=document.createElement("canvas"),lctx=low.getContext("2d",{willReadFrequently:true});

const LOOKS={
  ccd:{name:"CCD",label:"CCD コンデジ(2002)",fps:24},
  cmos:{name:"CMOS",label:"CMOS ケータイ(2008)",fps:24},
  "8mm":{name:"8mm",label:"8ミリビデオ",fps:12},
  vhs:{name:"VHS",label:"VHS ホームビデオ",fps:15}
};
let look="ccd",kind="photo",facing="environment",zoom=1,recording=false;
let stream=null,recorder=null,blobs=[],recStartTime=0,lastURL=null,lastKind=null;
let LW=240,LH=320,SC=2;

/* ================= 音（WebAudio合成） ================= */
let actx=null;
function audio(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(actx&&actx.state==="suspended")actx.resume();
  return actx;
}
const soundOn=()=>$("sound").checked;
function noiseBuf(a,dur){
  const n=a.sampleRate*dur|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  return b;
}
function click(a,t,freq,dur,vol,lowthump){
  const s=a.createBufferSource();s.buffer=noiseBuf(a,dur);
  const hp=a.createBiquadFilter();hp.type="bandpass";hp.frequency.value=freq;hp.Q.value=0.8;
  const g=a.createGain();g.gain.value=vol;
  s.connect(hp).connect(g).connect(a.destination);s.start(t);
  if(lowthump){
    const o=a.createOscillator(),og=a.createGain();
    o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(70,t+0.05);
    og.gain.setValueAtTime(vol*0.7,t);og.gain.exponentialRampToValueAtTime(0.001,t+0.06);
    o.connect(og).connect(a.destination);o.start(t);o.stop(t+0.07);
  }
}
function playShutter(){ // カシャッ：開く＋閉じる
  if(!soundOn())return;const a=audio();if(!a)return;const t=a.currentTime;
  if(look==="cmos"){ // 電子的なシャッター
    click(a,t,3200,0.03,0.5,false);
    const o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.value=1200;
    g.gain.setValueAtTime(0.0001,t+0.03);g.gain.linearRampToValueAtTime(0.12,t+0.035);g.gain.exponentialRampToValueAtTime(0.001,t+0.09);
    o.connect(g).connect(a.destination);o.start(t+0.03);o.stop(t+0.1);
  }else{
    click(a,t,2600,0.045,0.9,true);
    click(a,t+0.085,1800,0.06,0.7,true);
  }
}
function beep(t0,dur,freq){
  const a=audio();if(!a)return;const t=a.currentTime+t0;
  const o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.value=freq||2000;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.16,t+0.004);
  g.gain.setValueAtTime(0.16,t+dur-0.01);g.gain.linearRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+0.01);
}
const beepStart=()=>{if(soundOn())beep(0,0.11,2000);};          // ピッ
const beepStop=()=>{if(soundOn()){beep(0,0.07,2000);beep(0.12,0.07,2000);}}; // ピピッ

/* ================= カメラ ================= */
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2200);}
async function startCamera(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  const withAudio=$("mic").checked;
  const base={video:{facingMode:facing,width:{ideal:1280},height:{ideal:960}}};
  try{
    stream=await navigator.mediaDevices.getUserMedia({...base,audio:withAudio?{echoCancellation:true,noiseSuppression:true}:false});
  }catch(e){
    try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});toast("マイクなしで起動しました");}
    catch(e2){toast("カメラ起動失敗: "+e2.message);return;}
  }
  video.srcObject=stream;video.muted=true;
  try{await video.play();}catch(e){}
}

/* ================= サイズ ================= */
function fitCanvas(){
  if(recording)return;
  const vf=$("vf"),W=vf.clientWidth||360,H=vf.clientHeight||640;
  LW=240;LH=Math.max(120,Math.round(LW*H/W/2)*2);SC=2;
  low.width=LW;low.height=LH;canvas.width=LW*SC;canvas.height=LH*SC;
  initFixed();
}
let colFPN,hotPix,rowNoise;
function initFixed(){
  colFPN=new Float32Array(LW);for(let x=0;x<LW;x++)colFPN[x]=(Math.random()-.5)*5;
  rowNoise=new Float32Array(LH);
  hotPix=[];for(let i=0;i<14;i++)hotPix.push([Math.random()*LW|0,Math.random()*LH|0,120+Math.random()*135]);
  prevCol=null;smear=new Float32Array(LW);
}
let prevCol=null,smear=null,skew=0,vigTab=null;
window.addEventListener("resize",fitCanvas);

/* ================= 画像処理 ================= */
const clamp=v=>v<0?0:v>255?255:v;
let frameN=0;
function amount(){return $("tape").value/100;}

function processCCD(d,w,h,k){
  // 垂直スミア：強い光源の縦方向への漏れ（CCD特有）
  smear.fill(0);
  for(let y=0;y<h;y+=2)for(let x=0;x<w;x++){const i=(y*w+x)*4;const l=(d[i]+d[i+1]+d[i+2])/3;if(l>225)smear[x]+=(l-225);}
  for(let x=0;x<w;x++)smear[x]=Math.min(70,smear[x]/(h/2)*5*(0.5+k));
  const cx=w/2,cy=h/2,mx=cx*cx+cy*cy;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    let r=d[i],g=d[i+1],b=d[i+2];
    let l=(r+g+b)/3;
    // 彩度＆コントラスト（CCDの濃い発色）
    r=l+(r-l)*(1.2+.1*k);g=l+(g-l)*(1.2+.1*k);b=l+(b-l)*(1.2+.1*k);
    r=(r-128)*1.1+134;g=(g-128)*1.1+132;b=(b-128)*1.1+138;
    // 色ノイズ（CCDはチャンネルごとに粒状）
    const nl=(Math.random()-.5)*10*k;
    r+=nl+(Math.random()-.5)*14*k;g+=nl+(Math.random()-.5)*14*k;b+=nl+(Math.random()-.5)*14*k;
    // ハイライトのブルーミング（白飛び周辺のにじみ＋パープルフリンジ）
    l=(r+g+b)/3;
    if(l>215){const e=(l-215)/40;r+=e*12;b+=e*26;g+=e*8;}
    const s=smear[x];r+=s*.85;g+=s*.9;b+=s;
    // ビネット
    const dx=x-cx,dy=y-cy,v=1-.28*(dx*dx+dy*dy)/mx;
    d[i]=clamp(r*v);d[i+1]=clamp(g*v);d[i+2]=clamp(b*v);
  }
}

function processCMOS(d,w,h,k){
  // 列方向の固定パターンノイズ、行バンディング、暗部ノイズ
  for(let y=0;y<h;y++)rowNoise[y]=(Math.random()-.5)*7*k;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    let r=d[i],g=d[i+1],b=d[i+2];
    const l=(r+g+b)/3;
    // 強めのコントラスト・ハイライトの硬い白飛び
    r=(r-128)*1.22+126;g=(g-128)*1.22+128;b=(b-128)*1.22+124;
    // 暗部ほど目立つ輝度ノイズ
    const sh=1-l/255,n=(Math.random()-.5)*(6+34*sh*sh)*(.4+k*1.2);
    const f=colFPN[x]*k*1.4+rowNoise[y];
    r+=n+f;g+=n*1.1+f;b+=n*1.3+f;
    // 暗部はグリーン〜シアンかぶり、明部はやや黄色
    if(l<90){g+=(90-l)*.07*(.5+k);r-=(90-l)*.03;}else if(l>180){r+=4;g+=3;b-=5;}
    d[i]=clamp(r);d[i+1]=clamp(g);d[i+2]=clamp(b);
  }
  for(const p of hotPix){ // ホットピクセル
    if(k<.15)break;const i=(p[1]*w+p[0])*4;d[i]=clamp(d[i]+p[2]*k);d[i+1]=clamp(d[i+1]+p[2]*k*.4);
  }
}

function process8mm(d,w,h,k){
  const flick=1+(Math.random()-.5)*.12*(0.5+k);
  const cx=w/2,cy=h/2,mx=cx*cx+cy*cy;
  const sx=Math.random()*w|0,hasScr=Math.random()<.18*k;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    let r=d[i],g=d[i+1],b=d[i+2];const a=(r+g+b)/3;
    const n=(Math.random()-.5)*(18+30*k);
    r=r*.93+a*.07;g=g*.89+a*.11;b=b*.85+a*.15;
    r=r*1.08+n+10;g=g*1.0+n*.8+4;b=b*.82+n*.9-4;
    const dx=x-cx,dy=y-cy,v=1-.45*(dx*dx+dy*dy)/mx;
    r*=v*flick;g*=v*flick;b*=v*flick;
    if(hasScr&&Math.abs(x-sx)<1){r+=70;g+=70;b+=60;}
    d[i]=clamp(r);d[i+1]=clamp(g);d[i+2]=clamp(b);
  }
  // ほこり
  const nd=(Math.random()*6*k)|0;
  for(let q=0;q<nd;q++){const x=Math.random()*(w-3)|0,y=Math.random()*(h-3)|0;
    for(let a=0;a<3;a++)for(let c=0;c<3;c++){const i=((y+a)*w+x+c)*4;d[i]=d[i+1]=d[i+2]=20;}}
}

function processVHS(d,w,h,k){
  const band=((frameN*3)%(h*2))-h*.5; // 流れるトラッキングノイズ帯
  for(let y=0;y<h;y++){
    let cr=0,cb=0;
    const inBand=y>band&&y<band+10*(.5+k);
    const sl=(y%2===0)?.9:1.05;
    for(let x=0;x<w;x++){
      const i=(y*w+x)*4;
      const r=d[i],g=d[i+1],b=d[i+2];
      const l=.3*r+.59*g+.11*b;
      // 色は横方向に滲む（クロマ帯域不足）
      cr+=((r-l)-cr)*.18;cb+=((b-l)-cb)*.18;
      let n=(Math.random()-.5)*(30+40*k);
      if(inBand)n=(Math.random()-.5)*220*(.4+k);
      const L=(l-128)*.9+128+n;
      d[i]=clamp((L+cr*1.1)*sl);d[i+1]=clamp((L-.3*cr-.2*cb)*sl);d[i+2]=clamp((L+cb*1.1)*sl);
    }
  }
}

// CMOSローリングシャッター：パン方向を推定して行ごとにずらす
function estimateSkew(d,w,h){
  const col=new Float32Array(w);
  for(let y=0;y<h;y+=3)for(let x=0;x<w;x++){const i=(y*w+x)*4;col[x]+=d[i+1];}
  if(prevCol){
    let best=0,bs=1e12;
    for(let s=-10;s<=10;s++){let sad=0;
      for(let x=12;x<w-12;x+=2)sad+=Math.abs(col[x]-prevCol[x+s]);
      if(sad<bs){bs=sad;best=s;}}
    skew=skew*.6+best*.4;
  }
  prevCol=col;
}

/* ================= 描画ループ ================= */
function drawDateStamp(){
  if(!$("stamp").checked)return;
  const n=new Date(),p=v=>String(v).padStart(2,"0");
  const t=look==="vhs"?`${n.getFullYear()}.${p(n.getMonth()+1)}.${p(n.getDate())}  ${p(n.getHours())}:${p(n.getMinutes())}`
          :`'${String(n.getFullYear()).slice(-2)} ${p(n.getMonth()+1)} ${p(n.getDate())}`;
  ctx.font=`${Math.round(canvas.width/30)}px 'Press Start 2P',monospace`;
  ctx.textAlign="right";ctx.textBaseline="alphabetic";
  const x=canvas.width-canvas.width*.04,y=canvas.height-canvas.height*.035;
  ctx.fillStyle="#ff7a00";ctx.shadowColor="#ff3d0088";ctx.shadowBlur=4;
  if(look==="vhs"){ctx.fillStyle="#fff";ctx.shadowColor="#0008";}
  ctx.fillText(t,x,y);ctx.shadowBlur=0;
}

function render(){
  frameN++;
  if(video.readyState>=2){
    const vw=video.videoWidth,vh=video.videoHeight;
    const tar=LW/LH,ar=vw/vh;let sw=vw,sh=vh;
    if(ar>tar)sw=vh*tar;else sh=vw/tar;
    sw/=zoom;sh/=zoom;
    const sx=(vw-sw)/2,sy=(vh-sh)/2;
    lctx.drawImage(video,sx,sy,sw,sh,0,0,LW,LH);
    const img=lctx.getImageData(0,0,LW,LH),k=amount();
    if(look==="ccd")processCCD(img.data,LW,LH,k);
    else if(look==="cmos"){estimateSkew(img.data,LW,LH);processCMOS(img.data,LW,LH,k);}
    else if(look==="8mm")process8mm(img.data,LW,LH,k);
    else processVHS(img.data,LW,LH,k);
    lctx.putImageData(img,0,0);
    ctx.imageSmoothingEnabled=false;
    ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height);
    if(look==="cmos"&&Math.abs(skew)>.3){ // 行ごとのずれ（ジェロ効果）
      for(let y=0;y<LH;y++){
        const off=skew*(y/LH-.5)*1.6*SC;
        ctx.drawImage(low,0,y,LW,1,off,y*SC,canvas.width,SC);
      }
    }else if(look==="vhs"){
      for(let y=0;y<LH;y++){
        let off=0;const fromBot=LH-y;
        if(fromBot<10)off=(10-fromBot)*(Math.sin(frameN*.7+y)*1.2+1.5)*amount()*SC*.8;
        off+=(Math.random()-.5)*.8*amount()*SC;
        ctx.drawImage(low,0,y,LW,1,off,y*SC,canvas.width,SC);
      }
    }else ctx.drawImage(low,0,0,canvas.width,canvas.height);
    drawDateStamp();
  }
  if(recording){
    const s=Math.floor((Date.now()-recStartTime)/1000);
    $("timecode").textContent=`${String(s/60|0).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  }
  requestAnimationFrame(render);
}

/* ================= 撮影 ================= */
function setThumb(url,k){
  lastURL=url;lastKind=k;
  if(k==="photo")$("thumb").style.backgroundImage=`url(${url})`;
  else{
    const c=document.createElement("canvas");c.width=104;c.height=104;
    const x=c.getContext("2d");const s=Math.min(canvas.width,canvas.height);
    x.drawImage(canvas,(canvas.width-s)/2,(canvas.height-s)/2,s,s,0,0,104,104);
    $("thumb").style.backgroundImage=`url(${c.toDataURL("image/jpeg",.7)})`;
  }
}
function takePhoto(){
  playShutter();
  $("shutterBlack").classList.remove("go");void $("shutterBlack").offsetWidth;$("shutterBlack").classList.add("go");
  if(look==="ccd"){$("flash").classList.remove("go");void $("flash").offsetWidth;$("flash").classList.add("go");}
  canvas.toBlob(blob=>{
    const url=URL.createObjectURL(blob);
    setThumb(url,"photo");
    const a=document.createElement("a");a.href=url;a.download=`heisei_${look}_${Date.now()}.jpg`;a.click();
  },"image/jpeg",0.92);
}
function startRec(){
  blobs=[];
  beepStart();
  const fps=LOOKS[look].fps;
  const cs=canvas.captureStream(fps);
  const at=stream&&stream.getAudioTracks()[0];if(at)cs.addTrack(at);
  const types=["video/webm;codecs=vp8,opus","video/webm","video/mp4"];
  const mt=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
  try{recorder=new MediaRecorder(cs,mt?{mimeType:mt}:undefined);}catch(e){toast("録画に対応していません");return;}
  recorder.ondataavailable=e=>{if(e.data.size>0)blobs.push(e.data);};
  recorder.onstop=()=>{
    const type=recorder.mimeType||"video/webm";
    const url=URL.createObjectURL(new Blob(blobs,{type}));
    setThumb(url,"video");lastURL=url;lastKind="video";
    lastExt=type.includes("mp4")?"mp4":"webm";
    openPreview();
  };
  setTimeout(()=>{ // ピッ音が録音に入らないよう少し待つ
    recStartTime=Date.now();recorder.start(100);
  },160);
  recording=true;document.body.classList.add("recording");
}
let lastExt="webm";
function stopRec(){
  if(!recording)return;
  recording=false;document.body.classList.remove("recording");
  if(recorder&&recorder.state!=="inactive")recorder.stop();
  beepStop();
}
$("shutter").onclick=()=>{
  audio();
  if(kind==="photo")takePhoto();
  else recording?stopRec():startRec();
};

/* ================= UI ================= */
const looksEl=$("looks");
for(const k in LOOKS){
  const b=document.createElement("button");b.textContent=LOOKS[k].label;b.dataset.l=k;if(k===look)b.className="on";
  b.onclick=()=>{
    if(recording)return;look=k;prevCol=null;skew=0;
    looksEl.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
    $("lookName").textContent=LOOKS[k].name;
    if(k==="8mm"||k==="vhs"){if(kind==="photo")toast(LOOKS[k].name+"：ビデオ向けの質感です");}
  };
  looksEl.appendChild(b);
}
document.querySelectorAll("#kind span").forEach(s=>s.onclick=()=>{
  if(recording)return;kind=s.dataset.k;
  document.querySelectorAll("#kind span").forEach(x=>x.classList.toggle("on",x===s));
  document.body.classList.toggle("video",kind==="video");
});
document.querySelectorAll("#zoomPill button").forEach(b=>b.onclick=()=>setZoom(+b.dataset.z));
function setZoom(z){
  zoom=Math.max(1,Math.min(6,z));
  document.querySelectorAll("#zoomPill button").forEach(x=>x.classList.toggle("on",+x.dataset.z===Math.round(zoom)&&Math.abs(zoom-Math.round(zoom))<.15));
}
$("flip").onclick=async()=>{if(recording)return;facing=facing==="environment"?"user":"environment";await startCamera();};
$("gridBtn").onclick=()=>{$("grid").classList.toggle("on");$("gridBtn").classList.toggle("on");};
$("gearBtn").onclick=()=>$("sheet").classList.add("open");
$("closeSheet").onclick=()=>$("sheet").classList.remove("open");
$("mic").onchange=()=>{if(!recording)startCamera();};

// タップでフォーカス枠、ピンチでズーム
const vf=$("vf");let pinch=null;
vf.addEventListener("pointerdown",e=>{
  if(e.target.closest("#zoomPill"))return;
  const r=vf.getBoundingClientRect(),f=$("focus");
  f.style.left=(e.clientX-r.left)+"px";f.style.top=(e.clientY-r.top)+"px";
  f.classList.remove("go");void f.offsetWidth;f.classList.add("go");
});
vf.addEventListener("touchmove",e=>{
  if(e.touches.length===2){
    const dd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(pinch)setZoom(zoom*dd/pinch);pinch=dd;e.preventDefault();
  }
},{passive:false});
vf.addEventListener("touchend",()=>pinch=null);

// プレビュー
function openPreview(){
  if(!lastURL)return;
  const body=$("pvBody");body.innerHTML="";
  const el=document.createElement(lastKind==="video"?"video":"img");
  el.src=lastURL;if(lastKind==="video"){el.controls=true;el.autoplay=true;el.playsInline=true;}
  el.style.maxWidth="100%";el.style.maxHeight="70vh";body.appendChild(el);
  const a=$("pvSave");a.href=lastURL;a.download=lastKind==="video"?`heisei_${look}_${Date.now()}.${lastExt}`:`heisei_${look}_${Date.now()}.jpg`;
  $("preview").classList.add("open");
}
$("thumb").onclick=openPreview;
$("pvClose").onclick=()=>{$("preview").classList.remove("open");$("pvBody").innerHTML="";};

fitCanvas();
await startCamera();
render();
})();
</script>
